<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Route Finder</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #000000;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        color: #ffffff;
      }

      .container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
      }

      .card {
        background: #111111;
        padding: clamp(1rem, 5vw, 2rem);
        border: 1px solid #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        width: 100%;
      }

      h1 {
        color: #ffffff;
        margin-bottom: clamp(1rem, 4vw, 2rem);
        text-align: center;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .search-container {
        display: flex;
        flex-direction: column;
        gap: clamp(0.5rem, 2vw, 1rem);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      label {
        font-size: clamp(0.8rem, 2vw, 0.9rem);
        color: #cccccc;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      input {
        width: 100%;
        padding: clamp(8px, 2vw, 12px) clamp(12px, 3vw, 16px);
        border: 1px solid #333;
        border-radius: clamp(6px, 2vw, 10px);
        font-size: clamp(0.9rem, 2vw, 1rem);
        transition: all 0.3s ease;
        background: #222;
        color: #ffffff;
      }

      input:focus {
        outline: none;
        border-color: #ffffff;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
      }

      input::placeholder {
        color: #666;
      }

      .search-button {
        width: 100%;
        margin-top: clamp(0.8rem, 2vw, 1rem);
        padding: clamp(10px, 2vw, 14px) clamp(16px, 4vw, 24px);
        background: #ffffff;
        color: #000000;
        border: none;
        border-radius: clamp(6px, 2vw, 10px);
        font-size: clamp(0.9rem, 2vw, 1rem);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .search-button:hover {
        background: #cccccc;
        transform: translateY(-2px);
      }

      .search-button:active {
        transform: translateY(0);
      }

      .results-container {
        margin-top: clamp(1.5rem, 4vw, 2rem);
        padding-top: clamp(1rem, 3vw, 1rem);
        border-top: 1px solid #333;
      }

      #messages {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      /* FIXED: single column for alt routes, grid for direct routes */
      #result {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .direct-routes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }

      .route-item {
        background: #222;
        padding: clamp(0.8rem, 3vw, 1rem);
        border-radius: clamp(6px, 2vw, 10px);
        border-left: 4px solid #ffffff;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .route-item:hover {
        transform: translateX(5px);
        background: #2a2a2a;
      }

      .route-number {
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 0.5rem;
        letter-spacing: 1px;
      }

      .route-stops {
        color: #cccccc;
        font-size: clamp(0.8rem, 2vw, 0.9rem);
      }

      .alt-route {
        border-left-color: #ffffff;
        width: 100%;
      }

      .alt-summary {
        color: #cccccc;
        font-size: clamp(0.75rem, 2vw, 0.85rem);
        margin-bottom: 0.6rem;
      }

      .alt-section {
        border-top: 1px solid #2a2a2a;
        padding-top: 0.6rem;
        margin-top: 0.6rem;
      }

      .alt-section-title {
        color: #ffffff;
        font-size: clamp(0.7rem, 2vw, 0.85rem);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 0.45rem;
      }

      /* FIXED: wrap instead of scroll */
      .alt-path {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0;
      }

      .alt-path-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.6rem;
        border-radius: 8px;
        border: 1px solid #2c2c2c;
        background: #1a1a1a;
      }

      /* Arrow after each item except last */
      .alt-path-item:not(:last-child)::after {
        content: "→";
        color: #555;
        font-size: 0.85rem;
        margin-left: 0.25rem;
      }

      .alt-path-index {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: #ffffff;
        color: #000000;
        font-size: 0.7rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .alt-path-name {
        font-size: clamp(0.75rem, 2vw, 0.9rem);
        color: #e6e6e6;
      }

      /* FIXED: segments in a responsive grid */
      .segments-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 0.75rem;
        margin-top: 0.5rem;
      }

      .alt-segment {
        background: #1a1a1a;
        border: 1px solid #2c2c2c;
        border-radius: 8px;
        padding: 0.55rem 0.7rem;
      }

      .alt-segment-title {
        color: #ffffff;
        font-size: clamp(0.75rem, 2vw, 0.85rem);
        font-weight: 600;
      }

      .alt-bus-line {
        margin-top: 0.3rem;
        color: #c8c8c8;
        font-size: clamp(0.7rem, 2vw, 0.85rem);
        line-height: 1.4;
      }

      .loading-spinner {
        width: clamp(30px, 8vw, 40px);
        height: clamp(30px, 8vw, 40px);
        border: 4px solid #ff0000;
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        margin: clamp(15px, 4vw, 20px) auto;
        animation: spin 1s linear infinite;
      }

      .hidden {
        display: none;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .error-message {
        color: #ffffff;
        text-align: center;
        padding: clamp(0.8rem, 2vw, 1rem);
        background: #ff0000;
        border-radius: clamp(6px, 2vw, 10px);
        margin-top: clamp(0.8rem, 2vw, 1rem);
      }

      .error-suggestions {
        margin-top: 0.5rem;
        color: #ffffff;
        font-size: clamp(0.75rem, 2vw, 0.85rem);
      }

      .notice-message {
        margin-bottom: 0.75rem;
        padding: 0.6rem 0.8rem;
        border: 1px solid #333;
        border-radius: 8px;
        background: #1a1a1a;
        color: #cccccc;
        font-size: clamp(0.8rem, 2vw, 0.9rem);
      }

      @media screen and (max-width: 480px) {
        .card {
          margin: 0;
          border-radius: 15px;
        }

        .direct-routes-grid {
          grid-template-columns: 1fr;
        }

        .segments-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Mangalore Bus Route Finder</h1>
        <div class="search-container">
          <div class="input-group">
            <label for="start">Start Location</label>
            <input
              id="start"
              type="text"
              placeholder="Enter start stop..."
              autocomplete="off"
            />
          </div>
          <div class="input-group">
            <label for="end">Destination</label>
            <input
              id="end"
              type="text"
              placeholder="Enter destination stop..."
              autocomplete="off"
            />
          </div>
          <button onclick="findRoute()" class="search-button">
            <span class="button-text">Find Routes</span>
          </button>
        </div>

        <div class="results-container">
          <div id="messages"></div>
          <div id="result"></div>
          <div id="loading" class="loading-spinner hidden"></div>
        </div>
      </div>
    </div>

    <script>
      function formatBusLabel(value) {
        if (!value) return "Bus";
        const trimmed = String(value).trim();
        const lower = trimmed.toLowerCase();
        return lower.includes("bus") ? trimmed : `Bus ${trimmed}`;
      }

      async function findRoute() {
        const startInput = document.getElementById("start");
        const endInput = document.getElementById("end");
        const resultDiv = document.getElementById("result");
        const messagesDiv = document.getElementById("messages");
        const loadingSpinner = document.getElementById("loading");

        const start = startInput.value.trim();
        const end = endInput.value.trim();

        if (!start || !end) {
          showError("Please enter both start and end stops.");
          return;
        }

        loadingSpinner.classList.remove("hidden");
        resultDiv.innerHTML = "";
        messagesDiv.innerHTML = "";

        try {
          const response = await fetch(
            `http://localhost:5000/route/${encodeURIComponent(start)}/${encodeURIComponent(end)}`,
          );
          const data = await response.json();

          loadingSpinner.classList.add("hidden");

          if (data.error) {
            showError(data.error, data.suggestions);
          } else {
            const routes = Array.isArray(data) ? data : data.routes || [];
            displayRoutes(routes, data);
          }
        } catch (error) {
          console.error("Error fetching route data:", error);
          loadingSpinner.classList.add("hidden");
          showError("Unable to fetch routes. Please try again later.");
        }
      }

      function displayRoutes(routes, meta = {}) {
        const resultDiv = document.getElementById("result");
        const messagesDiv = document.getElementById("messages");
        resultDiv.innerHTML = "";
        messagesDiv.innerHTML = "";

        const hasRoutes = routes.length > 0;
        const hasAlternative =
          !hasRoutes && Boolean(meta.alternativeRoute?.stops?.length);

        if (meta.info) {
          const info = document.createElement("div");
          info.className = "notice-message";
          info.textContent = meta.info;
          messagesDiv.appendChild(info);
        }

        if (
          meta.corrections &&
          (meta.corrections.start || meta.corrections.end)
        ) {
          const notice = document.createElement("div");
          notice.className = "notice-message";
          const startStop = meta.resolvedStops?.start ?? "start";
          const endStop = meta.resolvedStops?.end ?? "end";
          const pieces = [];
          if (meta.corrections.start) {
            pieces.push(`start: ${meta.corrections.start}`);
          }
          if (meta.corrections.end) {
            pieces.push(`end: ${meta.corrections.end}`);
          }
          notice.textContent = `Interpreted input as ${startStop} to ${endStop}. (${pieces.join(", ")})`;
          messagesDiv.appendChild(notice);
        }

        if (!hasRoutes && !hasAlternative) {
          showError("No routes found between these stops.");
          return;
        }

        if (hasRoutes) {
          const grid = document.createElement("div");
          grid.className = "direct-routes-grid";
          routes.forEach((route) => {
            const routeElement = document.createElement("div");
            routeElement.className = "route-item";

            const routeNumber = document.createElement("div");
            routeNumber.className = "route-number";
            routeNumber.textContent = formatBusLabel(route.busNumber);

            const routeStops = document.createElement("div");
            routeStops.className = "route-stops";
            routeStops.textContent = route.route.join(" → ");

            routeElement.appendChild(routeNumber);
            routeElement.appendChild(routeStops);
            grid.appendChild(routeElement);
          });
          resultDiv.appendChild(grid);
        }

        if (hasAlternative) {
          renderAlternativeRoute(meta.alternativeRoute);
        }
      }

      function renderAlternativeRoute(alternativeRoute) {
        const resultDiv = document.getElementById("result");
        const routeElement = document.createElement("div");
        routeElement.className = "route-item alt-route";

        const routeNumber = document.createElement("div");
        routeNumber.className = "route-number";
        routeNumber.textContent = "Transfer route (no direct bus)";

        const summary = document.createElement("div");
        summary.className = "alt-summary";
        const stopCount = alternativeRoute.stops.length;
        const segmentCount = alternativeRoute.segments?.length || 0;
        const transfers = Math.max(segmentCount - 1, 0);
        summary.textContent = `Stops: ${stopCount} • Transfers: ${transfers}`;

        const pathSection = document.createElement("div");
        pathSection.className = "alt-section";

        const pathTitle = document.createElement("div");
        pathTitle.className = "alt-section-title";
        pathTitle.textContent = "Path (in order)";
        pathSection.appendChild(pathTitle);

        const pathList = document.createElement("ol");
        pathList.className = "alt-path";
        alternativeRoute.stops.forEach((stop, index) => {
          const item = document.createElement("li");
          item.className = "alt-path-item";

          const indexBadge = document.createElement("span");
          indexBadge.className = "alt-path-index";
          indexBadge.textContent = String(index + 1);

          const name = document.createElement("span");
          name.className = "alt-path-name";
          name.textContent = stop;

          item.appendChild(indexBadge);
          item.appendChild(name);
          pathList.appendChild(item);
        });

        pathSection.appendChild(pathList);

        routeElement.appendChild(routeNumber);
        routeElement.appendChild(summary);
        routeElement.appendChild(pathSection);

        if (alternativeRoute.segments?.length) {
          const segmentSection = document.createElement("div");
          segmentSection.className = "alt-section";

          const segmentTitle = document.createElement("div");
          segmentTitle.className = "alt-section-title";
          segmentTitle.textContent = "Recommended buses";
          segmentSection.appendChild(segmentTitle);

          const segmentsGrid = document.createElement("div");
          segmentsGrid.className = "segments-grid";

          alternativeRoute.segments.forEach((segment) => {
            const item = document.createElement("div");
            item.className = "alt-segment";

            const title = document.createElement("div");
            title.className = "alt-segment-title";
            title.textContent = `Recommended: ${formatBusLabel(segment.busNumber)}`;

            const stopLine = document.createElement("div");
            stopLine.className = "alt-bus-line";
            stopLine.textContent = `${segment.from} → ${segment.to}`;

            const stopsDetail = document.createElement("div");
            stopsDetail.className = "alt-bus-line";
            stopsDetail.textContent = `Stops: ${segment.stops.join(" → ")}`;

            const allBuses = document.createElement("div");
            allBuses.className = "alt-bus-line";
            const available = segment.availableBuses?.length
              ? segment.availableBuses.join(", ")
              : formatBusLabel(segment.busNumber);
            allBuses.textContent = `All buses on this leg: ${available}`;

            item.appendChild(title);
            item.appendChild(stopLine);
            item.appendChild(stopsDetail);
            item.appendChild(allBuses);
            segmentsGrid.appendChild(item);
          });

          segmentSection.appendChild(segmentsGrid);
          routeElement.appendChild(segmentSection);
        }

        resultDiv.appendChild(routeElement);
      }

      function showError(message, suggestions) {
        const resultDiv = document.getElementById("result");
        const messagesDiv = document.getElementById("messages");
        const suggestionLines = [];
        if (suggestions?.start?.length) {
          suggestionLines.push(`Start: ${suggestions.start.join(", ")}`);
        }
        if (suggestions?.end?.length) {
          suggestionLines.push(`End: ${suggestions.end.join(", ")}`);
        }
        const suggestionHtml = suggestionLines.length
          ? `<div class="error-suggestions">Did you mean ${suggestionLines.join(" | ")}</div>`
          : "";
        resultDiv.innerHTML = "";
        messagesDiv.innerHTML = `
          <div class="error-message">
            ${message}
            ${suggestionHtml}
          </div>
        `;
      }

      document.getElementById("start").addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          document.getElementById("end").focus();
        }
      });

      document.getElementById("end").addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          findRoute();
        }
      });
    </script>
  </body>
</html>
